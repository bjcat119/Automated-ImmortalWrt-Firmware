name: ImmortalWrt Image Builder

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Target PROFILE'
        required: false
        default: 'linksys_wrt1900ac-v2'
      download_url:
        description: 'Image Builder tar.zst URL'
        required: false
        default: 'https://downloads.immortalwrt.org/releases/24.10.6/targets/mvebu/cortexa9/immortalwrt-imagebuilder-24.10.6-mvebu-cortexa9.Linux-x86_64.tar.zst'

env:
  PROFILE: ${{ github.event.inputs.profile || 'linksys_wrt1900ac-v2' }}
  DOWNLOAD_URL: ${{ github.event.inputs.download_url || 'https://downloads.immortalwrt.org/releases/24.10.6/targets/mvebu/cortexa9/immortalwrt-imagebuilder-24.10.6-mvebu-cortexa9.Linux-x86_64.tar.zst' }}
  PACKAGES_LIST_FILE: packages.list
  UCI_CUSTOM_FILE: uci-custom
  PACKAGES_FOLDER: packages
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl xz-utils zstd rsync

      - name: Download Image Builder
        run: |
          mkdir -p /tmp/ib_download
          curl -L "$DOWNLOAD_URL" -o /tmp/ib_download/ib.tar.zst

      - name: Extract Image Builder
        run: |
          mkdir -p /tmp/ib
          tar --use-compress-program=zstd -xf /tmp/ib_download/ib.tar.zst -C /tmp/ib
          IB_DIR=$(find /tmp/ib -maxdepth 1 -type d -name 'immortalwrt-imagebuilder-*' | head -n1)
          echo "IB_DIR=$IB_DIR" >> "$GITHUB_ENV"

      - name: Prepare packages list
        run: |
          if [ -f "$PACKAGES_LIST_FILE" ]; then
            PACKAGES=$(grep -v '^\s*#' "$PACKAGES_LIST_FILE" | tr '\n' ' ')
          else
            PACKIES=""
            PACKAGES=""
          fi
          echo "PACKAGES=$PACKAGES" >> "$GITHUB_ENV"

      - name: Copy uci-defaults
        run: |
          if [ -f "$UCI_CUSTOM_FILE" ]; then
            mkdir -p "$IB_DIR/files/etc/uci-defaults"
            cp "$UCI_CUSTOM_FILE" "$IB_DIR/files/etc/uci-defaults/99-custom"
            chmod 755 "$IB_DIR/files/etc/uci-defaults/99-custom"
          fi

      - name: Copy local ipk packages
        run: |
          if [ -d "$PACKAGES_FOLDER" ] && [ "$(ls -A $PACKAGES_FOLDER 2>/dev/null)" ]; then
            mkdir -p "$IB_DIR/packages"
            cp -r "$PACKAGES_FOLDER/"* "$IB_DIR/packages/" 2>/dev/null || true
          fi

      - name: Build firmware
        working-directory: ${{ env.IB_DIR }}
        run: |
          make image \
            PROFILE="${{ env.PROFILE }}" \
            PACKAGES="${{ env.PACKAGES }}" \
            FILES="files"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: immortalwrt-24.10.6-wrt1900acv2
          path: ${{ env.IB_DIR }}/bin/targets/mvebu/cortexa9/*
